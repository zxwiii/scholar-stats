name: Update Scholar Stats

on:
  schedule:
    # 每天北京时间凌晨 04:00 (UTC 20:00) 自动执行
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update.py with SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python update.py

      - name: Commit and Push
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email github-actions[bot]@users.noreply.github.com
          git add scholar.json
          git commit -m "Update scholar stats $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push

      - name: Purge jsDelivr CDN Cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/zxwiii/scholar-stats@main/scholar.json"
