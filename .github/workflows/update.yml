name: Update Scholar Stats

on:
  schedule:
    # 每天 UTC 时间 20:00 (即北京时间每天凌晨 04:00) 自动运行
    - cron: '0 20 * * *'
  # 允许你在网页上手动点击按钮立即运行测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update.py
        run: python update.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scholar.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update scholar stats [skip ci]" && git push)
